<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | LEUKOCYTENG</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Quill WYSIWYG Themes -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  
  <style>
    body { background: var(--bg-primary); }
    [contenteditable="true"]:empty:before {
      content: attr(placeholder);
      pointer-events: none;
      display: block; /* For Firefox */
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar__logo">LEUKOCYTENG Admin</div>
      <nav class="admin-nav">
        <a href="#" class="active" id="navNewPost"><span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></span> Write Post</a>
        <a href="#" id="navManagePosts"><span>📂</span> Manage Posts</a>
        <a href="index.html" style="margin-top: 40px; border-left: none; color: var(--text-muted);"><span>&larr;</span> Back to Site</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      
      <!-- Write View -->
      <div id="viewWrite">
        <div class="admin-header">
          <h1>Create New Post</h1>
          <button class="btn btn-primary" id="btnPublish">Publish Post</button>
        </div>

        <div class="admin-meta">
          <div class="form-group">
            <label>Post Title</label>
            <input type="text" id="postTitle" placeholder="Enter an engaging title...">
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="postCategory">
              <option value="Web Dev">Web Development</option>
              <option value="SEO">SEO</option>
              <option value="Blockchain">Blockchain</option>
              <option value="Marketing">Marketing</option>
              <option value="Design">Design</option>
            </select>
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 24px;">
          <label>Short Excerpt</label>
          <input type="text" id="postExcerpt" placeholder="Brief summary of the article (for homepage/blog feed)">
        </div>

        <div class="admin-editor" style="background: var(--bg-secondary); border-radius: var(--radius-md);">
          <div id="editor-area" style="height: 450px; font-family: var(--font-body); color: var(--text-primary); border: 1px solid var(--border); border-radius: 0 0 var(--radius-md) var(--radius-md);"></div>
        </div>
      </div>

      <!-- Manage View -->
      <div id="viewManage" style="display: none;">
        <div class="admin-header">
          <h1>Manage Posts</h1>
        </div>
        <table class="admin-posts-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="postsTableBody">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <div class="toast" id="adminToast"></div>

  <script src="js/admin.js"></script>
</body>
</html>
